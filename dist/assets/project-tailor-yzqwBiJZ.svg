<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5C27FE"/>
      <stop offset="1" stop-color="#00D1FF"/>
    </linearGradient>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#0b0630" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <circle cx="720" cy="60" r="150" fill="#fff" opacity="0.08"/>
  <circle cx="60" cy="470" r="130" fill="#fff" opacity="0.08"/>

  <!-- app window -->
  <g filter="url(#sh)">
    <rect x="70" y="50" width="660" height="400" rx="18" fill="#ffffff"/>
  </g>
  <rect x="70" y="50" width="660" height="40" rx="18" fill="#f1f5f9"/>
  <rect x="70" y="72" width="660" height="18" fill="#f1f5f9"/>
  <circle cx="94" cy="70" r="6" fill="#ff6b6b"/><circle cx="114" cy="70" r="6" fill="#ffd166"/><circle cx="134" cy="70" r="6" fill="#4ade80"/>

  <!-- sidebar -->
  <rect x="70" y="90" width="150" height="360" fill="#1A1245"/>
  <rect x="70" y="430" width="150" height="20" fill="#1A1245"/>
  <text x="92" y="122" fill="#fff" font-size="15" font-weight="800">TailorPro</text>
  <g font-size="12" fill="#a9a3d6">
    <rect x="84" y="142" width="122" height="30" rx="8" fill="#5C27FE"/>
    <text x="100" y="162" fill="#fff" font-weight="600">Dashboard</text>
    <text x="100" y="196">Customers</text>
    <text x="100" y="228">Measurements</text>
    <text x="100" y="260">Orders</text>
    <text x="100" y="292">Payments</text>
    <text x="100" y="324">Reports</text>
  </g>

  <!-- stat cards -->
  <g>
    <rect x="240" y="108" width="140" height="74" rx="12" fill="#f5f3ff"/>
    <text x="256" y="132" font-size="11" fill="#6b7280">Active Orders</text>
    <text x="256" y="163" font-size="26" font-weight="800" fill="#1A1245">48</text>

    <rect x="392" y="108" width="140" height="74" rx="12" fill="#ecfeff"/>
    <text x="408" y="132" font-size="11" fill="#6b7280">Customers</text>
    <text x="408" y="163" font-size="26" font-weight="800" fill="#1A1245">326</text>

    <rect x="544" y="108" width="170" height="74" rx="12" fill="#f0fdf4"/>
    <text x="560" y="132" font-size="11" fill="#6b7280">This Month</text>
    <text x="560" y="163" font-size="26" font-weight="800" fill="#1A1245">Rs 412K</text>
  </g>

  <!-- orders table -->
  <text x="240" y="216" font-size="13" font-weight="700" fill="#1A1245">Recent Orders</text>
  <g font-size="11" fill="#374151">
    <rect x="240" y="228" width="474" height="30" rx="8" fill="#f8fafc"/>
    <text x="254" y="247">#1042  Kamal Perera</text><text x="430" y="247">Suit - 2 pcs</text>
    <rect x="620" y="235" width="80" height="16" rx="8" fill="#dcfce7"/><text x="637" y="247" fill="#15803d" font-weight="600">Ready</text>

    <rect x="240" y="264" width="474" height="30" rx="8" fill="#f8fafc"/>
    <text x="254" y="283">#1041  Nimal Silva</text><text x="430" y="283">Shirt - 4 pcs</text>
    <rect x="620" y="271" width="80" height="16" rx="8" fill="#ede9fe"/><text x="630" y="283" fill="#5C27FE" font-weight="600">Stitching</text>

    <rect x="240" y="300" width="474" height="30" rx="8" fill="#f8fafc"/>
    <text x="254" y="319">#1040  Ayesha Fernando</text><text x="430" y="319">Saree Blouse</text>
    <rect x="620" y="307" width="80" height="16" rx="8" fill="#fef3c7"/><text x="632" y="319" fill="#b45309" font-weight="600">Cutting</text>
  </g>

  <!-- measurement strip -->
  <rect x="240" y="350" width="474" height="80" rx="12" fill="#1A1245"/>
  <text x="258" y="376" font-size="12" font-weight="700" fill="#fff">Measurements  -  Kamal Perera</text>
  <g font-size="11" fill="#c4b5fd">
    <text x="258" y="402">Chest</text><text x="258" y="420" fill="#fff" font-size="14" font-weight="700">40"</text>
    <text x="338" y="402">Waist</text><text x="338" y="420" fill="#fff" font-size="14" font-weight="700">34"</text>
    <text x="418" y="402">Shoulder</text><text x="418" y="420" fill="#fff" font-size="14" font-weight="700">18"</text>
    <text x="508" y="402">Sleeve</text><text x="508" y="420" fill="#fff" font-size="14" font-weight="700">25"</text>
    <text x="588" y="402">Length</text><text x="588" y="420" fill="#fff" font-size="14" font-weight="700">30"</text>
  </g>
  <!-- tape measure -->
  <g transform="translate(672 372) rotate(-15)">
    <rect x="0" y="0" width="34" height="34" rx="8" fill="#fcd34d"/>
    <circle cx="17" cy="17" r="9" fill="#1A1245"/>
    <circle cx="17" cy="17" r="3" fill="#fcd34d"/>
  </g>
</svg>
